const laws=[{"slug":"basic-rules","number":"01","title":"기본 운영규정","summary":"RAON 서버 이용자가 가장 먼저 확인해야 하는 공통 운영 원칙입니다.","effective":"2026.07.22","sections":[{"title":"제1조｜기본 원칙","clauses":["모든 이용자는 서로를 존중하며 건전한 서버 환경을 유지해야 합니다.","욕설, 비하, 조롱, 성희롱, 패드립, 혐오 표현 등 상대방에게 불쾌감을 주는 행위를 금지합니다.","다른 이용자의 정상적인 역할극과 게임 진행을 고의로 방해해서는 안 됩니다.","규정에 명시되지 않은 상황은 규정의 취지, 피해 규모와 고의성을 종합하여 판단합니다."]},{"title":"제2조｜닉네임 및 신분 설정","clauses":["닉네임은 한글 사용을 원칙으로 하며 영문, 숫자, 특수문자의 사용은 제한될 수 있습니다.","욕설, 비하, 정치·성적 표현 또는 광고성 문구가 포함된 닉네임은 사용할 수 없습니다.","운영진, 유명인 또는 다른 이용자를 사칭하거나 혼동을 유발해서는 안 됩니다.","부적절한 닉네임은 운영진의 안내에 따라 변경해야 합니다."]},{"title":"제3조｜계정 관리","clauses":["계정은 본인만 사용해야 하며 공유, 대여, 판매 또는 양도할 수 없습니다.","제재를 회피하기 위한 부계정 사용은 금지하며 관련 계정이 함께 제재될 수 있습니다.","다중 계정으로 재화, 보상 또는 혜택을 중복 획득해서는 안 됩니다.","관리 소홀로 발생한 계정 피해는 복구가 제한될 수 있습니다."]},{"title":"제4조｜채팅 및 음성","clauses":["전체 채팅, 지역 채팅, 무전과 음성 채팅은 각각의 목적에 맞게 사용해야 합니다.","도배, 고성, 음성 테러, 반복적인 음악 재생과 불필요한 소음을 금지합니다.","개인 간 분쟁을 공개 채널로 확대하거나 다른 이용자의 참여를 유도해서는 안 됩니다.","서버 또는 타 서버의 광고와 승인받지 않은 외부 링크 게시를 금지합니다."]},{"title":"제5조｜비정상적인 플레이","clauses":["버그, 오류 또는 시스템의 허점을 이용하여 이득을 얻는 행위를 금지합니다.","핵, 매크로, 변조 파일 등 승인되지 않은 프로그램을 사용할 수 없습니다.","재화와 아이템을 복제하거나 잠수·반복 행동으로 보상을 부당하게 획득해서는 안 됩니다.","오류를 발견한 경우 악용하지 말고 즉시 운영진에게 신고해야 합니다."]},{"title":"제6조｜거래 및 개인정보","clauses":["서버 재화, 차량, 아이템과 계정을 현금 또는 외부 물품과 거래할 수 없습니다.","다른 이용자의 개인정보를 동의 없이 수집, 공개, 유포하거나 역할극에 이용해서는 안 됩니다.","신상 추적, 현실 협박과 외부 괴롭힘은 중대한 위반으로 처리합니다.","비정상 거래로 취득한 재화와 아이템은 회수될 수 있습니다."]},{"title":"제7조｜신고와 운영진 조사","clauses":["신고 시 사건 전후 상황과 음성이 포함된 원본 영상을 제출하는 것을 원칙으로 합니다.","허위 신고, 증거 조작, 보복성 신고와 조사 중 허위 진술을 금지합니다.","운영진의 정당한 조사와 자료 제출 요청에 협조해야 합니다.","판단에 이의가 있으면 공개적인 비난 대신 정해진 이의제기 절차를 이용해야 합니다."]},{"title":"제8조｜제재 기준","clauses":["제재는 구두주의, 공식 경고, 시간 제한, 기간 정지, 영구 정지 순으로 적용할 수 있습니다.","고의성, 반복성, 피해 규모와 조사 방해 여부에 따라 단계가 가중되거나 생략될 수 있습니다.","핵 사용, 현금거래, 개인정보 유포와 중대한 제재 회피는 즉시 영구 정지될 수 있습니다.","모든 제재 기록은 운영진이 보관하며 동일한 기준을 적용합니다."]}]},{"slug":"rp-rules","number":"02","title":"RP 규정","summary":"역할극의 흐름과 몰입을 보호하기 위한 상황별 행동 기준입니다.","effective":"2026.07.22","sections":[{"title":"제1조｜RP의 기본","clauses":["RP는 캐릭터의 성격, 직업과 상황에 맞게 행동하며 이야기를 만들어가는 역할극을 의미합니다.","자신의 승리보다 모든 참여자가 이어갈 수 있는 상황을 만드는 것을 우선합니다.","상대방에게 대응할 시간과 선택의 기회를 제공해야 합니다.","현실적으로 불가능하거나 개연성이 현저히 부족한 행동은 제한됩니다."]},{"title":"제2조｜NON-RP 및 BAD-RP","clauses":["역할극 상황에서 현실의 이야기나 게임 시스템을 직접 언급하는 NON-RP를 금지합니다.","상황의 개연성을 무시하거나 고의로 몰입을 깨뜨리는 BAD-RP를 금지합니다.","규정 문제는 현장에서 다투지 말고 상황 종료 후 신고 절차로 처리합니다.","긴급한 오류가 발생한 경우 상대방에게 간단히 알리고 운영진의 안내를 따릅니다."]},{"title":"제3조｜RDM·VDM","clauses":["충분한 역할극과 명확한 사유 없이 다른 사람을 공격하거나 살해하는 RDM을 금지합니다.","차량을 무기처럼 사용하여 사람을 고의로 치거나 위협하는 VDM을 금지합니다.","우발적인 충돌이 발생하면 즉시 정차하고 부상 확인과 후속 역할극을 진행해야 합니다.","도주 목적이라도 반복적으로 사람을 들이받는 행위는 허용되지 않습니다."]},{"title":"제4조｜NLR","clauses":["사망 또는 완전한 의식 소실 이후 해당 사건의 구체적인 기억을 이용할 수 없습니다.","부활 직후 복수하거나 같은 사건 현장에 즉시 복귀해서는 안 됩니다.","사건과 무관한 일상적 관계와 장기 설정은 유지할 수 있습니다.","의료진의 정상적인 치료로 소생한 경우 기억 범위는 당시 상황과 운영 기준에 따라 판단합니다."]},{"title":"제5조｜MG·PG","clauses":["방송, 디스코드, 화면 공유 등 게임 밖에서 얻은 정보를 사용하는 MG를 금지합니다.","상대방이 대응할 수 없는 강제 행동이나 시스템상 가능한 점을 악용하는 PG를 금지합니다.","타인의 위치, 신분과 계획은 캐릭터가 정상적으로 얻은 정보만 사용할 수 있습니다.","행동을 확정해서 서술하지 말고 상대방이 결과에 반응할 여지를 남겨야 합니다."]},{"title":"제6조｜납치·강도·인질극","clauses":["범죄 역할극은 명확한 목적과 충분한 사전 상호작용을 갖춰야 합니다.","신규 이용자, 정상적인 업무 수행 중인 운영 인력과 진행 불가능 상태인 이용자를 무리하게 대상으로 삼지 않습니다.","과도한 시간 끌기, 반복 납치와 굴욕적인 행동 강요를 금지합니다.","인질의 안전과 협상 기회를 보장하고 사건 종료 후 보복성 추적을 해서는 안 됩니다."]},{"title":"제7조｜전투와 로그아웃","clauses":["교전 전에는 상대방이 인지할 수 있는 명확한 상황과 경고가 있어야 합니다.","부상 상태를 무시하거나 연속으로 무기를 사용하는 행위는 제한됩니다.","체포, 추격, 교전 또는 신고가 진행 중인 상황에서 고의로 종료하는 전투 로그를 금지합니다.","불가피하게 종료된 경우 가능한 한 빠르게 복귀하여 상대방 또는 운영진에게 알려야 합니다."]},{"title":"제8조｜녹화 권장","clauses":["분쟁 가능성이 있는 상황에서는 사건 시작 전부터 영상 녹화를 권장합니다.","자신에게 유리한 장면만 잘라낸 영상은 증거 능력이 제한될 수 있습니다.","영상이 없더라도 서버 기록과 다수의 일치하는 진술로 조사할 수 있습니다.","녹화 자료는 신고 목적 외에 타인을 조롱하거나 선동하는 용도로 사용해서는 안 됩니다."]}]},{"slug":"citizen-law","number":"03","title":"시민 법률","summary":"도시에서 발생하는 주요 범죄와 처벌의 공통 기준입니다.","effective":"2026.07.22","sections":[{"title":"제1조｜처벌의 원칙","clauses":["처벌은 행위의 고의성, 피해 규모, 재범 여부와 사건 경위를 함께 고려합니다.","하나의 행위가 여러 위반에 해당하면 각 항목을 병합하여 처벌할 수 있습니다.","자수, 피해 회복과 수사 협조는 감경 사유가 될 수 있습니다.","증거 인멸, 도주, 공범 은닉과 반복 범행은 가중 사유가 됩니다."]},{"title":"제2조｜폭행 및 상해","clauses":["단순 폭행은 타인에게 고의로 물리력을 행사한 경우에 성립합니다.","무기 사용 또는 치료가 필요한 피해를 발생시킨 경우 특수폭행이나 상해로 가중됩니다.","다수의 인원이 공동으로 공격하면 공동폭행으로 처리할 수 있습니다.","정당방위는 현재 진행 중인 부당한 공격을 막기 위한 필요한 범위에서만 인정됩니다."]},{"title":"제3조｜살인 및 살인미수","clauses":["타인을 고의로 사망하게 한 경우 살인죄를 적용합니다.","실행에 착수했으나 결과가 발생하지 않은 경우 살인미수로 처리합니다.","계획성, 잔혹성, 다수 피해 또는 공무 수행 중인 공무원을 대상으로 한 범행은 가중됩니다.","우발성과 즉각적인 자수 여부는 사건 기록을 토대로 판단합니다."]},{"title":"제4조｜절도·강도·사기","clauses":["타인의 재산을 허락 없이 가져가면 절도죄가 성립합니다.","폭행이나 협박을 이용하여 재산을 빼앗으면 강도죄로 처리합니다.","거짓말로 재산상 이익을 취득하면 사기죄가 성립합니다.","피해액, 범행 횟수와 조직성에 따라 벌금과 수감 시간이 가중됩니다."]},{"title":"제5조｜납치·감금·협박","clauses":["타인을 의사에 반하여 이동시키면 납치죄가 성립합니다.","정당한 이유 없이 이동의 자유를 제한하면 감금죄로 처리합니다.","생명, 신체 또는 재산에 해를 가하겠다고 위협하면 협박죄가 성립합니다.","인질 이용, 금품 요구 또는 장시간 감금이 동반되면 가중 처벌합니다."]},{"title":"제6조｜공무집행 관련 범죄","clauses":["적법한 공무 수행을 폭행, 협박 또는 차량으로 방해하면 공무집행방해죄가 성립합니다.","신분 확인, 정차와 현장 통제 등 정당한 명령을 반복적으로 거부하면 명령불응으로 처리할 수 있습니다.","공무원을 사칭하거나 표식과 장비를 무단 사용해서는 안 됩니다.","공무원의 위법한 행위에 대한 이의제기는 현장 저항이 아닌 신고와 항소 절차로 진행합니다."]},{"title":"제7조｜재물손괴·주거침입","clauses":["타인의 차량, 건물 또는 물품을 고의로 파손하면 재물손괴죄가 성립합니다.","소유자나 관리자의 허가 없이 제한된 공간에 침입하면 주거·건조물침입죄로 처리합니다.","퇴거 요구를 받고도 정당한 이유 없이 머무르면 퇴거불응에 해당합니다.","피해 복구 비용은 형사 처벌과 별도로 청구될 수 있습니다."]},{"title":"제8조｜범인도피·증거인멸","clauses":["범인의 도피를 돕거나 은신처와 이동 수단을 제공하면 범인도피죄가 성립합니다.","수사에 필요한 물품, 영상과 기록을 숨기거나 훼손하면 증거인멸죄로 처리합니다.","거짓 알리바이 제공과 허위 진술은 수사 방해로 가중될 수 있습니다.","단순히 진술을 거부하는 것과 적극적으로 허위 증거를 만드는 행위는 구분합니다."]}]},{"slug":"traffic-law","number":"04","title":"교통법","summary":"안전한 차량 운행과 단속, 면허 및 사고 처리 기준입니다.","effective":"2026.07.22","sections":[{"title":"제1조｜운전자의 의무","clauses":["운전자는 도로 구조, 신호와 주변 상황에 맞는 안전한 속도로 운행해야 합니다.","보행자와 긴급차량의 통행을 우선하여 보호해야 합니다.","위험한 역주행, 인도 주행, 반복적인 중앙선 침범과 고의 충돌을 금지합니다.","차량을 방치하여 도로와 시설 이용을 방해해서는 안 됩니다."]},{"title":"제2조｜신호·속도 위반","clauses":["교통신호와 경찰의 수신호를 따라야 합니다.","도심, 주거지역과 혼잡 구간에서는 사고를 예방할 수 있도록 감속해야 합니다.","과속으로 사고 위험이나 실제 피해가 발생하면 가중 처벌할 수 있습니다.","긴급피난 또는 적법한 긴급업무는 필요 범위에서 예외로 인정될 수 있습니다."]},{"title":"제3조｜난폭·보복운전","clauses":["지그재그 운전, 급정지, 반복 추월 등으로 타인을 위협하는 난폭운전을 금지합니다.","시비를 이유로 추격, 진로 방해 또는 고의 충돌하는 보복운전을 금지합니다.","차량 묘기와 드리프트는 허가된 장소에서만 가능합니다.","다수의 차량이 도로를 점거하는 행위는 사전 승인이 필요합니다."]},{"title":"제4조｜음주·약물 운전","clauses":["술이나 약물로 정상 운전이 어려운 상태에서는 운전할 수 없습니다.","측정 요구를 정당한 이유 없이 거부하면 별도의 위반으로 처리합니다.","음주·약물 운전 중 사고가 발생하면 면허 정지 또는 취소와 함께 가중 처벌합니다.","동승자가 위험 상태를 알고도 운전을 적극적으로 권유하거나 차량을 제공하면 책임을 질 수 있습니다."]},{"title":"제5조｜사고 후 조치","clauses":["교통사고 발생 시 즉시 정차하여 부상자와 피해 상태를 확인해야 합니다.","필요한 경우 의료국과 경찰에 신고하고 현장을 안전하게 확보해야 합니다.","인적·물적 피해를 발생시키고 도주하면 사고 후 미조치로 가중 처벌합니다.","경미한 사고는 당사자 간 합의가 가능하지만 허위 신고나 강요된 합의는 인정하지 않습니다."]},{"title":"제6조｜면허와 차량","clauses":["면허가 필요한 차량은 해당 면허를 취득한 뒤 운전해야 합니다.","무면허, 면허 정지 또는 취소 상태의 운전은 처벌 대상입니다.","도난 차량, 불법 개조 차량과 등록 정보가 조작된 차량은 압수될 수 있습니다.","차량 소유자는 자신의 차량이 범죄에 반복적으로 사용되지 않도록 관리해야 합니다."]},{"title":"제7조｜정차·주차","clauses":["교차로, 횡단보도, 터널, 긴급시설 출입구와 도로 한가운데에 주차할 수 없습니다.","장시간 방치되거나 통행을 방해하는 차량은 이동 또는 견인될 수 있습니다.","경찰의 적법한 이동 명령에 불응하면 추가 처벌할 수 있습니다.","견인과 보관에 필요한 비용은 차량 소유자가 부담할 수 있습니다."]}]},{"slug":"firearms-law","number":"05","title":"총기법","summary":"총기 허가, 소지, 사용, 보관과 거래에 관한 기준입니다.","effective":"2026.07.22","sections":[{"title":"제1조｜총기 분류","clauses":["총기는 민간 허가 총기, 직무용 총기와 불법 총기로 구분합니다.","총기의 분류와 허가 가능 여부는 서버 내 공식 목록을 기준으로 합니다.","탄약, 소음기와 주요 부품도 총기 관련 물품으로 취급할 수 있습니다.","새로운 총기가 추가되면 운영진과 치안기관이 분류를 공지합니다."]},{"title":"제2조｜허가 및 소지","clauses":["허가 대상 총기는 본인 명의의 유효한 총기허가증이 있어야 소지할 수 있습니다.","허가증을 타인에게 빌려주거나 명의를 대신 사용할 수 없습니다.","신원 확인과 결격 사유 심사를 거쳐 허가를 발급할 수 있습니다.","허가 조건을 위반하거나 중대한 범죄를 저지르면 허가가 정지 또는 취소될 수 있습니다."]},{"title":"제3조｜휴대와 보관","clauses":["공공장소에서 총기를 불필요하게 노출하거나 타인을 위협해서는 안 됩니다.","사용하지 않는 총기는 안전한 장소에 보관하고 타인의 접근을 막아야 합니다.","공공기관, 의료시설과 별도로 지정된 장소에는 허가 총기도 반입이 제한될 수 있습니다.","분실 또는 도난 사실을 알게 된 경우 즉시 경찰에 신고해야 합니다."]},{"title":"제4조｜정당한 사용","clauses":["총기 사용은 자신 또는 타인의 생명에 대한 급박한 위험을 막기 위한 필요한 범위에서만 허용됩니다.","재산 피해만을 막기 위해 곧바로 치명적인 총기를 사용하는 것은 정당화되기 어렵습니다.","위험이 종료된 뒤 추가 사격하거나 도주하는 사람을 무조건 사격해서는 안 됩니다.","총기를 사용한 사람은 안전 확보 후 경찰과 의료국에 신고해야 합니다."]},{"title":"제5조｜불법 소지·사용","clauses":["무허가 총기 소지, 허가 범위를 벗어난 휴대와 불법 개조는 처벌 대상입니다.","위협, 강도, 납치 또는 다른 범죄에 총기를 사용하면 가중 처벌합니다.","총기 일련정보를 훼손하거나 수사를 피하기 위해 외형을 변조해서는 안 됩니다.","불법 총기와 관련 탄약은 압수하며 반환하지 않습니다."]},{"title":"제6조｜제작·거래","clauses":["승인받지 않은 총기와 탄약의 제작, 판매, 교환과 무상 제공을 금지합니다.","합법 거래는 지정 업체와 정해진 절차를 통해서만 진행합니다.","허가가 없는 사람에게 총기를 판매하거나 대신 구매해 주는 행위를 금지합니다.","불법 유통에 사용된 자금과 장비는 수사 결과에 따라 압수될 수 있습니다."]},{"title":"제7조｜치안기관의 총기","clauses":["직무용 총기는 승인된 공무원이 근무 목적에 한하여 사용할 수 있습니다.","경고, 비살상 수단과 현장 위험도를 고려한 단계적 대응을 원칙으로 합니다.","직무용 총기의 사적 사용, 양도와 무단 반출은 엄격히 금지합니다.","사격이 발생한 사건은 지휘관에게 보고하고 필요 시 별도 감사를 진행합니다."]}]},{"slug":"contraband-law","number":"06","title":"불법물품법","summary":"마약과 불법 물품의 제조, 소지, 유통 및 압수 기준입니다.","effective":"2026.07.22","sections":[{"title":"제1조｜불법물품의 범위","clauses":["불법 마약류, 무허가 총기류, 위조 신분증, 위조 화폐와 범죄 전용 장비를 불법물품으로 봅니다.","서버 업데이트로 추가되는 물품은 공식 공지 후 본 규정의 적용을 받습니다.","합법 물품이라도 범죄 목적이 명확한 경우 증거물로 압수될 수 있습니다.","물품의 명칭보다 실제 기능과 사용 목적을 기준으로 판단합니다."]},{"title":"제2조｜소지","clauses":["불법물품을 신체, 차량, 주거지 또는 보관함에 보유하면 소지로 판단할 수 있습니다.","본인의 관리 영역에서 발견된 경우 취득 경위와 지배 가능성을 함께 조사합니다.","수사 전에 자진 신고하고 제출한 경우 감경할 수 있습니다.","소량이라도 반복 소지하거나 다른 범죄에 사용하면 가중될 수 있습니다."]},{"title":"제3조｜제조·재배","clauses":["마약류와 불법물품의 원료를 재배, 가공 또는 제조하는 행위를 금지합니다.","제조 장소, 장비와 원료를 제공하거나 관리한 사람도 공범으로 처리할 수 있습니다.","대량 제조, 반복 생산과 조직적 분업은 가중 처벌합니다.","제조에 사용된 시설, 장비와 완성품은 압수할 수 있습니다."]},{"title":"제4조｜판매·운반","clauses":["불법물품을 판매, 교환, 선물하거나 구매자를 연결하는 행위를 유통으로 봅니다.","대가를 받지 않았더라도 범죄 목적의 전달은 처벌 대상입니다.","차량이나 창고를 제공하여 운반을 도운 경우 공범으로 처리할 수 있습니다.","거래량, 수익, 횟수와 조직성을 고려하여 처벌을 가중합니다."]},{"title":"제5조｜사용","clauses":["불법 약물을 직접 사용하거나 타인에게 사용하도록 강요해서는 안 됩니다.","약물 영향 상태에서 운전, 폭행 또는 총기 사용을 하면 관련 범죄와 병합합니다.","타인의 동의 없이 약물을 투여하면 중대한 신체 범죄로 가중할 수 있습니다.","응급 치료를 요청한 사실만으로 즉시 면책되지는 않지만 구조 협조는 감경 사유가 될 수 있습니다."]},{"title":"제6조｜수색과 압수","clauses":["수색은 영장, 현행범, 긴급 상황 또는 당사자의 동의 등 적법한 근거가 있어야 합니다.","압수한 물품은 종류, 수량, 장소와 담당자를 기록해야 합니다.","불법물품은 원칙적으로 반환하지 않으며 정해진 절차에 따라 폐기합니다.","수색 과정에 이의가 있으면 현장 방해 없이 신고·항소 절차를 이용해야 합니다."]}]},{"slug":"public-service","number":"07","title":"공무원 규정","summary":"경찰청·보안국 등 공무원이 지켜야 할 업무와 품위 기준입니다.","effective":"2026.07.22","sections":[{"title":"제1조｜공무원의 기본 의무","clauses":["공무원은 시민의 안전과 공익을 우선하며 직무를 공정하게 수행해야 합니다.","친분, 소속, 후원 여부와 개인 감정에 따라 사건을 다르게 처리해서는 안 됩니다.","근무 중 취득한 비공개 정보와 개인정보를 외부에 유출할 수 없습니다.","직급과 권한을 이용하여 사적 이익을 요구하거나 부당한 지시를 해서는 안 됩니다."]},{"title":"제2조｜근무와 보고","clauses":["근무 시작과 종료, 장비 수령과 주요 사건은 정해진 방식으로 기록합니다.","상급자의 적법한 지시에 따르되 위법하거나 규정에 반하는 지시는 이의를 제기할 수 있습니다.","중대한 사건, 총기 사용과 민원이 예상되는 상황은 지휘관에게 즉시 보고합니다.","무단이탈, 허위 출퇴근 기록과 장기 잠수 근무를 금지합니다."]},{"title":"제3조｜체포와 고지","clauses":["체포에는 현행범, 영장 또는 긴급체포 등 적법한 사유가 있어야 합니다.","피의자에게 체포 이유와 주요 혐의를 이해할 수 있도록 고지해야 합니다.","도주나 공격 위험이 사라지면 과도한 물리력과 수갑 사용을 중단합니다.","체포 과정과 압수 물품은 사건 기록에 빠짐없이 남겨야 합니다."]},{"title":"제4조｜무력 사용","clauses":["대화와 명령, 비살상 장비, 치명적 무력 순으로 상황에 맞는 단계적 대응을 원칙으로 합니다.","시민과 공무원의 생명에 급박한 위험이 없는 경우 치명적 무력 사용을 자제합니다.","저항이 종료된 대상에게 추가 폭행, 사격 또는 모욕적인 행동을 해서는 안 됩니다.","무력 사용 후 부상자를 보호하고 필요한 의료 조치를 요청해야 합니다."]},{"title":"제5조｜수사와 정보 관리","clauses":["수사는 객관적인 증거와 일관된 진술을 바탕으로 진행해야 합니다.","증거를 조작, 은닉하거나 결론을 정해 두고 유리한 자료만 채택해서는 안 됩니다.","수사 정보는 사건 담당자와 승인된 지휘 체계 안에서만 공유합니다.","압수물과 증거 자료는 담당자, 시간과 이동 경로를 확인할 수 있도록 관리합니다."]},{"title":"제6조｜부패와 겸직","clauses":["뇌물 수수, 범죄 정보 제공, 증거 삭제와 범인 도피 지원을 금지합니다.","공무원 신분으로 범죄 조직의 활동에 참여하거나 이익을 공유할 수 없습니다.","이해관계가 있는 사건은 상급자에게 알리고 가능한 경우 담당에서 회피합니다.","허가되지 않은 겸직과 장비의 사적 사용은 징계 대상입니다."]},{"title":"제7조｜징계","clauses":["위반 정도에 따라 주의, 경고, 감봉, 강등, 정직, 해임으로 징계할 수 있습니다.","중대한 범죄, 부패, 개인정보 유출과 반복적인 권한 남용은 즉시 해임될 수 있습니다.","징계 대상자에게는 사실관계를 확인하고 소명할 기회를 제공합니다.","형사 처벌과 내부 징계는 별도로 적용할 수 있습니다."]}]},{"slug":"faction-rules","number":"08","title":"팩션 운영규정","summary":"공무원·기업·조직 팩션의 창설과 운영에 관한 공통 기준입니다.","effective":"2026.07.22","sections":[{"title":"제1조｜창설 기준","clauses":["팩션 창설은 운영진의 사전 심사와 승인을 받아야 합니다.","공무원·기업의 임시 창설 인원은 3~5명, 정식 창설 인원은 7~10명을 기준으로 합니다.","조직의 임시 창설 인원은 3명, 정식 창설 인원은 7명을 기준으로 합니다.","인원만 충족했다고 자동 승인되는 것은 아니며 활동 계획, 역할과 서버 기여도를 함께 심사합니다."]},{"title":"제2조｜대표자의 책임","clauses":["대표자는 구성원의 명단, 직급, 활동과 내부 규정을 관리해야 합니다.","구성원의 반복적인 규정 위반을 방치하거나 은폐해서는 안 됩니다.","장기 부재, 대표 변경과 운영 중단이 예상되면 운영진에게 미리 알려야 합니다.","대표자의 권한으로 구성원에게 현금 후원이나 현실의 대가를 요구할 수 없습니다."]},{"title":"제3조｜구성원 관리","clauses":["채용과 승진은 공개된 기준과 역할 수행 능력을 바탕으로 진행합니다.","차별, 친목 중심의 특혜, 괴롭힘과 부당한 강요를 금지합니다.","탈퇴 또는 해고를 이유로 게임 외부에서 보복하거나 개인정보를 공개해서는 안 됩니다.","구성원은 자신의 직급과 승인 범위를 넘어 팩션을 대표하는 약속을 할 수 없습니다."]},{"title":"제4조｜재정과 물품","clauses":["팩션 자금과 공용 물품은 팩션 목적에 맞게 사용하고 주요 내역을 기록해야 합니다.","공용 재산의 횡령, 무단 반출, 개인 거래와 퇴사 전 재산 이동을 금지합니다.","불법 수익을 합법 매출로 위장하거나 다른 팩션과 허위 거래를 만들어서는 안 됩니다.","해산 시 공용 재산의 처리 방식은 운영진의 안내를 따릅니다."]},{"title":"제5조｜활동과 영역","clauses":["승인받은 사업, 공무 또는 조직 활동의 범위 안에서 역할극을 진행합니다.","다른 팩션의 고유 업무를 반복적으로 침해하거나 정상 영업을 고의로 방해해서는 안 됩니다.","대규모 행사, 전쟁, 점거와 서버 전체에 영향을 주는 활동은 사전 협의가 필요합니다.","활동이 장기간 없거나 최소 인원이 유지되지 않으면 임시 전환 또는 해산될 수 있습니다."]},{"title":"제6조｜분쟁과 전쟁","clauses":["팩션 간 분쟁은 충분한 역할극상 원인과 단계적인 갈등 과정을 갖춰야 합니다.","기습적인 전면전 선언, 무제한 공격과 접속 중인 구성원 추적을 금지합니다.","중립 지역, 신규 이용자와 사건에 참여하지 않은 사람을 보호해야 합니다.","분쟁 종료 조건과 휴전 합의는 당사자와 운영진이 확인할 수 있도록 기록합니다."]},{"title":"제7조｜경고와 해산","clauses":["위반 시 시정명령, 팩션 경고, 활동 제한, 임시 자격 박탈과 해산을 적용할 수 있습니다.","중대한 버그 악용, 현금거래, 조직적 규정 위반과 운영 방해는 즉시 해산 사유가 됩니다.","팩션 제재와 구성원 개인 제재는 각각 적용할 수 있습니다.","해산된 팩션의 명칭과 자산을 우회하여 즉시 재창설하는 행위는 제한됩니다."]}]},{"slug":"appeals","number":"09","title":"신고·항소 안내","summary":"신고 접수, 증거 제출, 사건 심사와 이의제기 절차입니다.","effective":"2026.07.22","sections":[{"title":"제1조｜신고 접수","clauses":["신고자는 사건 발생 시각, 장소, 관련자, 진행 내용과 피해를 정확하게 작성해야 합니다.","같은 사건은 하나의 신고로 접수하고 추가 자료는 기존 접수 건에 제출합니다.","사건과 직접 관련이 없는 제3자의 추측성 신고와 여론 조성을 금지합니다.","긴급한 서버 피해가 계속되는 경우 관리자 호출 기능을 우선 사용할 수 있습니다."]},{"title":"제2조｜증거 자료","clauses":["영상은 사건 전후의 흐름, 화면과 음성이 확인되는 원본을 원칙으로 합니다.","의도적으로 잘라내거나 속도를 변경하여 사실관계를 왜곡한 자료는 인정하지 않습니다.","스크린샷은 보조 자료로 사용할 수 있으며 단독으로 전체 상황을 확정하지 않을 수 있습니다.","타인의 개인정보가 포함된 증거는 공개 채널이 아닌 지정된 접수 공간에 제출해야 합니다."]},{"title":"제3조｜조사 절차","clauses":["담당 운영진은 신고 내용, 서버 기록과 양측의 진술을 확인합니다.","사건 당사자에게는 답변과 자료 제출을 위한 합리적인 시간을 제공합니다.","조사 중인 사건을 공개하여 여론을 유도하거나 증인을 압박해서는 안 됩니다.","담당자와 친분 또는 이해관계가 있는 사건은 다른 운영진에게 배정할 수 있습니다."]},{"title":"제4조｜처리 결과","clauses":["결과는 적용 규정, 확인된 사실과 조치 내용을 중심으로 안내합니다.","개인정보와 내부 보안 자료는 결과 안내에서 제외될 수 있습니다.","증거가 부족한 경우 무혐의를 확정하기보다 판단 보류 또는 증거 불충분으로 종결할 수 있습니다.","동일 사건에 대한 반복 접수는 새로운 증거가 있는 경우에만 재검토합니다."]},{"title":"제5조｜항소","clauses":["처분 당사자는 결과 통보 후 12시간 이내에 항소를 신청할 수 있습니다.","항소에는 이의가 있는 판단, 근거와 새롭게 확인할 자료를 구체적으로 작성해야 합니다.","동일 사건의 항소는 최대 3회까지 가능하며 내용 없는 반복 신청은 제한됩니다.","항소 심사는 가능하면 최초 담당자가 아닌 운영진이 진행합니다."]},{"title":"제6조｜허위·악성 신고","clauses":["타인을 제재받게 할 목적으로 사실을 꾸미거나 증거를 조작하면 제재됩니다.","협박 수단으로 신고를 이용하거나 취하의 대가를 요구해서는 안 됩니다.","처리 결과가 마음에 들지 않는다는 이유로 담당자를 모욕하거나 반복 호출하는 행위를 금지합니다.","신고 제도의 고의적인 악용은 신고 이용 제한과 별도의 서버 제재로 이어질 수 있습니다."]},{"title":"제7조｜복구 신청","clauses":["서버 오류로 재화나 아이템을 잃은 경우 발생 시각과 원본 영상을 제출해야 합니다.","이용자의 실수, 개인 인터넷 문제와 규정 위반 과정에서 발생한 손실은 복구가 제한됩니다.","허위 복구 신청은 지급 취소와 추가 제재 대상입니다.","복구 범위는 서버 기록과 제출 자료로 확인 가능한 손실에 한정합니다."]}]},{"slug":"admin-rules","number":"10","title":"관리자 규정","summary":"운영진의 권한, 사건 처리, 보안과 책임에 관한 내부 공통 기준입니다.","effective":"2026.07.22","sections":[{"title":"제1조｜관리자의 기본 자세","clauses":["관리자는 이용자를 존중하고 감정이 아닌 규정과 증거를 기준으로 업무를 수행합니다.","직급은 봉사를 위한 책임이며 이용자 위에 서는 특권으로 사용할 수 없습니다.","질문과 신고에 가능한 한 명확하고 일관된 답변을 제공합니다.","본인의 실수를 확인하면 즉시 보고하고 필요한 정정과 복구 절차를 진행합니다."]},{"title":"제2조｜권한 사용","clauses":["관리 기능은 점검, 복구, 행사와 사건 처리 등 승인된 업무에만 사용합니다.","개인적인 이동, 재화 획득, 지인 지원과 역할극상 이득을 위해 권한을 사용할 수 없습니다.","소환, 이동, 아이템 지급, 제재 등 주요 권한 사용은 기록을 남겨야 합니다.","테스트가 필요한 경우 지정된 장소와 계정을 사용하여 시민에게 영향을 주지 않도록 합니다."]},{"title":"제3조｜사건 처리","clauses":["관리자는 양측의 설명을 분리하여 듣고 원본 증거와 서버 기록을 확인합니다.","결론을 정한 상태에서 조사를 진행하거나 친분이 있는 사람의 진술을 우선해서는 안 됩니다.","처리 기준이 불명확하면 독단적으로 확정하지 말고 상급자 또는 회의를 통해 판단합니다.","제재 이유, 기간과 적용 규정을 당사자가 이해할 수 있도록 안내합니다."]},{"title":"제4조｜이해충돌","clauses":["본인, 가까운 지인, 소속 팩션 또는 직접 참여한 사건은 가능한 한 다른 관리자에게 넘깁니다.","사건 결과와 관련하여 선물, 재화, 직책과 현실의 대가를 받을 수 없습니다.","개인적인 다툼이 있는 이용자에게 관리자 권한으로 불이익을 주어서는 안 됩니다.","회피가 어려운 긴급 상황에서는 우선 피해를 막고 이후 상급자에게 전 과정을 보고합니다."]},{"title":"제5조｜정보 보안","clauses":["관리자 채널, 신고 내용, 개인정보, 접속 기록과 개발 정보를 외부에 유출할 수 없습니다.","권한 계정과 인증 수단을 공유하거나 다른 사람이 사용하도록 해서는 안 됩니다.","퇴사 또는 직책 변경 시 보유한 내부 자료와 접근 권한을 즉시 반납합니다.","보안 사고가 의심되면 숨기지 말고 즉시 최고관리자 또는 개발 담당자에게 보고합니다."]},{"title":"제6조｜이용자 응대","clauses":["반말, 조롱, 욕설, 공개 망신과 위압적인 언행을 금지합니다.","답변하기 어려운 내용은 추측으로 안내하지 말고 확인 후 답변합니다.","같은 기준의 문의에는 가능한 한 동일한 안내를 제공하고 변경 사항은 운영진에게 공유합니다.","업무 방해가 계속되는 경우 감정적으로 대응하지 말고 경고 후 정해진 절차로 처리합니다."]},{"title":"제7조｜징계와 퇴사","clauses":["관리자 규정 위반은 주의, 경고, 권한 제한, 강등, 정직과 해임으로 처리할 수 있습니다.","권한 악용, 개인정보 유출, 금품 수수와 증거 조작은 즉시 해임 및 서버 제재 사유가 됩니다.","내부 징계 대상자에게 사실 확인과 소명 기회를 제공하되 긴급한 권한 제한을 먼저 적용할 수 있습니다.","퇴사 후에도 재직 중 취득한 비공개 정보에 대한 보안 의무는 유지됩니다."]},{"title":"제8조｜규정 개정","clauses":["운영 규정의 변경은 변경 이유와 적용 시점을 명확히 하여 공지합니다.","중대한 변경은 관련 부서와 검토한 뒤 시행하는 것을 원칙으로 합니다.","소급 처벌은 원칙적으로 금지하며 사건 당시 시행 중인 규정을 적용합니다.","긴급한 악용 방지를 위한 임시 조치는 즉시 적용한 뒤 정식 규정으로 보완할 수 있습니다."]}]}]; const icons=["","","","","","","","","",""];
const cards=document.querySelector('#cards'),side=document.querySelector('#side');
laws.forEach((law,i)=>{const b=document.createElement('button');b.className='card';b.innerHTML='<div class="card-top"><span class="icon">'+icons[i]+'</span><span class="status">작성 완료</span></div><h3>'+law.title+'</h3><p>'+law.summary+'</p><span class="more">내용 확인 <b>→</b></span>';b.onclick=()=>showLaw(law.slug);cards.appendChild(b);const s=document.createElement('button');s.dataset.slug=law.slug;s.innerHTML='<b>'+law.number+'</b> '+law.title;s.onclick=()=>showLaw(law.slug);side.appendChild(s)});
function showLaw(slug,push=true){const law=laws.find(x=>x.slug===slug);if(!law)return;document.querySelector('#home').classList.add('hidden');document.querySelector('#detail').classList.remove('hidden');document.querySelectorAll('#side button').forEach(x=>x.classList.toggle('active',x.dataset.slug===slug));document.querySelector('#document').innerHTML='<div class="doc-head"><small>RAON SERVER LAW · '+law.number+'</small><h1>'+law.title+'</h1><p>'+law.summary+'</p><div class="meta"><span>시행일 '+law.effective+'</span><span>RAON 서버 운영진</span></div></div><div class="disclaimer">본 규정은 RAON 서버 내 역할극과 운영을 위한 가상 규정입니다. 모든 이용자는 서버 접속 전 내용을 확인해 주세요.</div>'+law.sections.map(s=>'<section class="article"><h2>'+s.title+'</h2><ol>'+s.clauses.map(c=>'<li>'+c+'</li>').join('')+'</ol></section>').join('')+'<div class="doc-end"><b>RAON 서버 운영진</b><p>규정을 확인하지 않았다는 사유는 제재 면제 사유가 되지 않습니다.</p></div>';if(push)location.hash='law/'+slug;scrollTo(0,0)}
function showHome(){document.querySelector('#detail').classList.add('hidden');document.querySelector('#home').classList.remove('hidden');history.pushState(null,'',location.pathname);scrollTo(0,0)}
function route(){if(location.hash.startsWith('#law/'))showLaw(location.hash.slice(5),false);else{document.querySelector('#home').classList.remove('hidden');document.querySelector('#detail').classList.add('hidden')}}addEventListener('hashchange',route);route();
</script><script id="raon-cat-mark-script">
(function(){
  var source=document.querySelector('.header .brand img');
  if(!source)return;
  document.querySelectorAll('.card .icon').forEach(function(target){
    var cat=source.cloneNode(true);
    cat.className='raon-cat-mark';
    cat.alt='라온 고양이 마크';
    target.replaceChildren(cat);
  });
})();
</script>
</body></html>
